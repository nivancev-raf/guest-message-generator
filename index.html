<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Guest Message Generator</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/guest-message-generator/manifest.json">
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="GuestMsg">
    <link rel="apple-touch-icon" href="/guest-message-generator/icon-192.png">
    
    <!-- Theme colors -->
    <meta name="theme-color" content="#0E0D0B">
    <meta name="msapplication-TileColor" content="#0E0D0B">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Loading screen (shown while the session is being checked) -->
    <div id="loadingScreen" class="screen loading-screen">
        <div class="spinner"></div>
    </div>

    <!-- Login screen -->
    <div id="loginScreen" class="screen login-screen" style="display: none;">
        <div class="login-brand">
            <img src="icon-512.png" alt="SmartHost" class="login-logo">
            <span class="kicker">SMARTHOST</span>
            <h1 class="login-title">Guest messages</h1>
        </div>

        <form id="loginForm" class="card login-card" novalidate>
            <label class="field">
                <span class="field-label">Email</span>
                <input type="email" id="loginEmail" class="input" autocomplete="username" inputmode="email" autocapitalize="none" placeholder="you@example.com" required>
            </label>

            <label class="field">
                <span class="field-label">Password</span>
                <input type="password" id="loginPassword" class="input" autocomplete="current-password" placeholder="Password" required>
            </label>

            <div id="loginError" class="form-error" style="display: none;"></div>

            <button type="submit" id="loginBtn" class="btn btn-primary">Log in</button>
        </form>
    </div>

    <!-- Main application -->
    <div id="appScreen" class="screen app-screen" style="display: none;">
        <header class="topbar">
            <img id="topbarLogo" src="icon-512.png" alt="SmartHost" class="topbar-logo">
            <button type="button" id="topbarBack" class="topbar-back" aria-label="Back" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <div class="topbar-text">
                <span id="topbarKicker" class="kicker">SMARTHOST</span>
                <span id="topbarTitle" class="topbar-title">New message</span>
            </div>
            <button type="button" id="topbarAvatar" class="topbar-avatar" aria-label="Profile" style="display: none;"></button>
            <button type="button" id="topbarAdd" class="topbar-add" style="display: none;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                Add
            </button>
        </header>

        <main class="app-main">
            <!-- View: Generate -->
            <section id="viewGenerator" class="view">
                <div class="view-content">
                    <div id="loadError" class="load-error" style="display: none;">
                        <span id="loadErrorText"></span>
                        <button type="button" id="retryLoadBtn" class="btn-text">Retry</button>
                    </div>

                    <div class="segmented segmented-dark segmented-full" role="radiogroup" aria-label="Message type">
                        <label class="segment"><input type="radio" name="messageType" value="res" checked><span>Reservation</span></label>
                        <label class="segment"><input type="radio" name="messageType" value="garage"><span>Garage info</span></label>
                    </div>

                    <div class="section">
                        <div class="section-label">APARTMENT</div>
                        <div class="card">
                            <div class="field">
                                <div class="select-wrap">
                                    <select id="apartmentSelect" class="input select select-strong" aria-label="Apartment" onchange="updateApartmentInfo(); clearValidation();">
                                        <option value="">Choose apartment...</option>
                                    </select>
                                    <svg class="select-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B655A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                                </div>
                                <div id="apartmentSelectError" class="field-error-text"></div>
                            </div>
                            <div id="apartmentInfo" class="apartment-summary" style="display: none;"></div>
                        </div>
                    </div>

                    <div class="section res-only">
                        <div class="section-label">GUEST</div>
                        <div class="card">
                            <label class="field">
                                <span class="field-label">Name</span>
                                <input type="text" id="guestName" class="input" placeholder="Guest name" oninput="clearValidation()">
                                <span id="guestNameError" class="field-error-text"></span>
                            </label>
                            <label class="field">
                                <span class="field-label">Mobile number</span>
                                <input type="tel" id="phoneNumber" class="input" placeholder="+381 6x xxx xxxx" oninput="clearValidation()">
                                <span id="phoneNumberError" class="field-error-text"></span>
                                <span class="helper">Include the country code, e.g. +381</span>
                            </label>
                        </div>
                    </div>

                    <div class="section res-only">
                        <div class="section-label">STAY</div>
                        <div class="card">
                            <div class="grid-2">
                                <label class="field">
                                    <span class="field-label">Check-in</span>
                                    <input type="date" id="checkIn" class="input input-date" onchange="clearValidation()">
                                    <span id="checkInError" class="field-error-text"></span>
                                </label>
                                <label class="field">
                                    <span class="field-label">Check-out</span>
                                    <input type="date" id="checkOut" class="input input-date" onchange="clearValidation()">
                                    <span id="checkOutError" class="field-error-text"></span>
                                </label>
                            </div>
                            <div id="nightsLabel" class="helper nights-label"></div>
                            <label class="field">
                                <span class="field-label">Total price</span>
                                <div class="input-suffix-wrap">
                                    <input type="text" id="reservationPrice" class="input input-with-suffix" inputmode="decimal" placeholder="560" oninput="clearValidation()">
                                    <span class="input-suffix">€</span>
                                </div>
                                <span id="reservationPriceError" class="field-error-text"></span>
                            </label>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-label">OPTIONS</div>
                        <div class="card card-rows">
                            <div class="option-row">
                                <span class="option-title">Language</span>
                                <div class="segmented segmented-light segmented-small" role="radiogroup" aria-label="Message language">
                                    <label class="segment"><input type="radio" name="language" value="sr" checked><span>Srpski</span></label>
                                    <label class="segment"><input type="radio" name="language" value="en"><span>English</span></label>
                                </div>
                            </div>
                            <label class="option-row option-row-toggle res-only">
                                <span class="option-text">
                                    <span class="option-title">Airport transport</span>
                                    <span class="option-sub">Mention the transfer offer</span>
                                </span>
                                <input type="checkbox" id="askForDrive" class="switch-input" checked>
                                <span class="switch" aria-hidden="true"></span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="sticky-action">
                    <button type="button" id="generateBtn" class="btn btn-primary">Generate message</button>
                </div>
            </section>

            <!-- View: Generated message -->
            <section id="viewGenerated" class="view" style="display: none;">
                <div class="view-content view-content-tight">
                    <div id="generatedChips" class="chips"></div>
                    <div class="message-bubble">
                        <div id="output" class="message-text"></div>
                        <div id="outputCount" class="message-count"></div>
                    </div>
                </div>

                <div class="sticky-action action-grid">
                    <button type="button" id="copyBtn" class="btn btn-outline" onclick="copyToClipboard()">Copy</button>
                    <button type="button" id="autoWhatsappBtn" class="btn btn-dark btn-two-line" onclick="autoSendToWhatsApp()">
                        <span>Send on WhatsApp</span>
                        <span id="whatsappSub" class="btn-sub"></span>
                    </button>
                </div>
            </section>

            <!-- View: Apartments -->
            <section id="viewApartments" class="view" style="display: none;">
                <div class="view-content view-content-list">
                    <div id="apartmentCount" class="section-label"></div>
                    <div id="apartmentList" class="card card-list"></div>
                </div>
            </section>

            <!-- View: Add / edit apartment -->
            <section id="viewApartmentForm" class="view" style="display: none;">
                <form id="apartmentForm" novalidate>
                    <div class="view-content">
                        <div class="section">
                            <div class="section-label">LISTING</div>
                            <div class="card">
                                <label class="field">
                                    <span class="field-label">Name <span class="req">*</span></span>
                                    <input type="text" id="aptName" class="input" maxlength="60">
                                    <span class="helper">Shown in your apartment list</span>
                                </label>
                            </div>
                        </div>

                        <div class="section">
                            <div class="section-label">LOCATION</div>
                            <div class="card">
                                <label class="field">
                                    <span class="field-label">Building</span>
                                    <input type="text" id="aptBuilding" class="input" placeholder="e.g. Sunny Residence">
                                </label>
                                <label class="field">
                                    <span class="field-label">Address</span>
                                    <input type="text" id="aptAddress" class="input">
                                </label>
                                <div class="grid-3">
                                    <label class="field">
                                        <span class="field-label">Apartment</span>
                                        <input type="text" id="aptNumber" class="input input-compact">
                                    </label>
                                    <label class="field">
                                        <span class="field-label">Entrance</span>
                                        <input type="text" id="aptEntrance" class="input input-compact" placeholder="—">
                                    </label>
                                    <label class="field">
                                        <span class="field-label">Floor</span>
                                        <input type="text" id="aptFloor" class="input input-compact">
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="section">
                            <div class="section-label">PARKING</div>
                            <div class="card grid-2">
                                <label class="field">
                                    <span class="field-label">Parking spot</span>
                                    <input type="text" id="aptParking" class="input input-compact">
                                </label>
                                <label class="field">
                                    <span class="field-label">Garage level</span>
                                    <input type="text" id="aptGarageLevel" class="input input-compact">
                                </label>
                            </div>
                        </div>

                        <div id="apartmentFormError" class="form-error" style="display: none;"></div>

                        <button type="button" id="deleteApartmentBtn" class="btn btn-danger-outline" style="display: none;">Delete apartment</button>
                    </div>

                    <div class="sticky-action">
                        <button type="submit" id="saveApartmentBtn" class="btn btn-primary">Save apartment</button>
                    </div>
                </form>
            </section>

            <!-- View: Templates -->
            <section id="viewMessages" class="view" style="display: none;">
                <div class="view-content">
                    <div class="card card-selector">
                        <div class="selector-row">
                            <label class="field">
                                <span class="field-label">Apartment</span>
                                <div class="select-wrap">
                                    <select id="msgApartment" class="input select select-strong select-compact"></select>
                                    <svg class="select-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B655A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                                </div>
                            </label>
                            <div class="segmented segmented-dark segmented-small segmented-lang" role="radiogroup" aria-label="Template language">
                                <label class="segment"><input type="radio" name="msgLanguage" value="sr" checked><span>SR</span></label>
                                <label class="segment"><input type="radio" name="msgLanguage" value="en"><span>EN</span></label>
                            </div>
                        </div>
                        <div class="segmented segmented-light segmented-full segmented-type" role="radiogroup" aria-label="Message type">
                            <label class="segment"><input type="radio" name="msgType" value="reservation" checked><span>With transport</span></label>
                            <label class="segment"><input type="radio" name="msgType" value="reservation_no_transport"><span>No transport</span></label>
                            <label class="segment"><input type="radio" name="msgType" value="garage"><span>Garage</span></label>
                        </div>
                    </div>

                    <div class="section">
                        <div class="message-header">
                            <span class="section-label section-label-inline">MESSAGE</span>
                            <span id="msgTemplateBadge" class="badge" style="display: none;">Custom</span>
                            <span class="spacer"></span>
                            <button type="button" id="msgResetBtn" class="btn-text" style="display: none;">Reset to default</button>
                        </div>
                        <div class="card card-editor">
                            <textarea id="msgTemplate" class="template-textarea" aria-label="Message template"></textarea>
                            <div class="variable-picker">
                                <div class="helper">Tap a variable to insert it at the cursor</div>
                                <div id="placeholderChips" class="variable-groups"></div>
                            </div>
                        </div>
                    </div>

                    <div id="msgStatus" class="status-line" style="display: none;"></div>
                </div>

                <div class="sticky-action">
                    <button type="button" id="saveMessagesBtn" class="btn btn-primary">Save template</button>
                </div>
            </section>

            <!-- View: Profile -->
            <section id="viewProfile" class="view" style="display: none;">
                <div class="view-content view-content-profile">
                    <div class="identity">
                        <div id="profileAvatar" class="avatar-lg"></div>
                        <div class="identity-text">
                            <span id="profileDisplayName" class="identity-name"></span>
                            <span id="profileEmail" class="identity-email"></span>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-label">ACCOUNT</div>
                        <form id="profileForm" class="card" novalidate>
                            <label class="field">
                                <span class="field-label">Email</span>
                                <input type="email" id="profileEmailInput" class="input" readonly tabindex="-1">
                            </label>
                            <label class="field">
                                <span class="field-label">Name <span class="req">*</span></span>
                                <input type="text" id="profileName" class="input" maxlength="40" autocomplete="given-name">
                                <span class="helper">Used in the greeting and on your messages</span>
                            </label>
                            <button type="submit" id="saveProfileBtn" class="btn btn-primary btn-medium">Save profile</button>
                            <div id="profileStatus" class="status-line" style="display: none;"></div>
                        </form>
                    </div>

                    <div class="card card-flush">
                        <button type="button" id="logoutBtn" class="logout-row">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/></svg>
                            Log out
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <!-- Bottom tab bar -->
        <nav class="tabbar" aria-label="Main">
            <button type="button" class="tab" data-tab="generator">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>
                <span>Generate</span>
            </button>
            <button type="button" class="tab" data-tab="apartments">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V4h9v16M14 9h5v11M3 20h18M8 8h3M8 12h3M8 16h3"/></svg>
                <span>Apartments</span>
            </button>
            <button type="button" class="tab" data-tab="messages">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>
                <span>Templates</span>
            </button>
            <button type="button" class="tab" data-tab="profile">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
                <span>Profile</span>
            </button>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="templates.js"></script>
    <script src="auth.js"></script>
    <script src="api.js"></script>
    <script src="pwa.js"></script>
    <script src="menu.js"></script>
    <script src="apartments.js"></script>
    <script src="editor.js"></script>
    <script src="profile.js"></script>
    <script src="app.js"></script>
</body>
</html>
