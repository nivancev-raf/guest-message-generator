<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Guest Message Generator</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/guest-message-generator/manifest.json">
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="GuestMsg">
    <link rel="apple-touch-icon" href="/guest-message-generator/icon-192.png">
    
    <!-- Theme colors -->
    <meta name="theme-color" content="#2c3e50">
    <meta name="msapplication-TileColor" content="#2c3e50">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Loading screen (shown while the session is being checked) -->
    <div id="loadingScreen" class="screen loading-screen">
        <div class="spinner"></div>
    </div>

    <!-- Login screen -->
    <div id="loginScreen" class="screen container" style="display: none;">
        <div class="header">
            <img src="icon-192.png" alt="Guest Message Generator" class="logo">
            <h1>Guest Message Generator</h1>
        </div>

        <form id="loginForm" class="form-group login-form" novalidate>
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" autocomplete="username" inputmode="email" autocapitalize="none" placeholder="you@example.com" required>

            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" autocomplete="current-password" placeholder="Password" required>

            <div id="loginError" class="error-message" style="display: none;"></div>

            <button type="submit" id="loginBtn" class="login-btn">Log in</button>
        </form>
    </div>

    <!-- Main application -->
    <div id="appScreen" class="screen container" style="display: none;">
        <div class="header">
            <button type="button" id="menuBtn" class="menu-btn" aria-label="Open menu" aria-controls="sideMenu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <img src="icon-192.png" alt="Guest Message Generator" class="logo">
            <h1>Guest Message Generator</h1>
            <div id="greeting" class="greeting"></div>
        </div>

    <!-- View: message generator -->
    <div id="viewGenerator" class="view">
    <div id="loadError" class="error-message load-error" style="display: none;">
        <span id="loadErrorText"></span>
        <button type="button" id="retryLoadBtn" class="retry-btn">Retry</button>
    </div>
    
    <div class="form-group">
        <label for="apartmentSelect" class="required-label">Select Apartment</label>
        <select id="apartmentSelect" onchange="updateApartmentInfo(); clearValidation();">
            <option value="">Choose apartment...</option>
        </select>
        <div id="apartmentInfo" class="apartment-info" style="display: none;"></div>
        <button type="button" id="editTemplatesBtn" class="edit-templates-btn" onclick="openMessagesView()" disabled>✏️ Edit messages</button>
    </div>
    
    <div class="form-group">
        <label for="guestName" class="required-label">Guest Name</label>
        <input type="text" id="guestName" placeholder="Enter guest name" oninput="clearValidation()">
    </div>
    
    <div class="form-group">
        <label for="phoneNumber" class="required-label">Mobile Number</label>
        <input type="tel" id="phoneNumber" placeholder="+381xxxxxxxxx" oninput="clearValidation()">
        <div class="phone-help">Include country code (e.g., +381 for Serbia)</div>
    </div>
    
    <div class="form-group date-group">
        <div class="date-field">
            <label for="checkIn" class="required-label">Check-in Date</label>
            <input type="date" id="checkIn" onchange="clearValidation()">
        </div>
        <div class="date-field">
            <label for="checkOut" class="required-label">Check-out Date</label>
            <input type="date" id="checkOut" onchange="clearValidation()">
        </div>
    </div>
    
    <div class="form-group">
        <label for="reservationPrice" class="required-label">Reservation Price</label>
        <input type="text" id="reservationPrice" placeholder="e.g., 560€ total price" oninput="clearValidation()">
    </div>
    
    <div class="form-group">
        <label class="checkbox-container">
            <input type="checkbox" id="askForDrive" checked>
            <span class="checkmark"></span>
            Include transport option
        </label>
    </div>
    
    <div class="form-group">
        <label class="form-label">Message Language</label>
        <div class="radio-group">
            <label class="radio-container">
                <input type="radio" name="language" value="sr" checked>
                <span class="radio-checkmark"></span>
                Serbian
            </label>
            <label class="radio-container">
                <input type="radio" name="language" value="en">
                <span class="radio-checkmark"></span>
                English
            </label>
        </div>
    </div>
    
    <div id="errorMessage" class="error-message" style="display: none;"></div>
    
    <div class="button-group">
        <div class="button-row">
            <button id="generateMessageBtn" onclick="generateMessage()" class="generate-btn" disabled>Generate Message</button>
            <button id="generateGarageBtn" onclick="generateGarageInfo()" class="garage-btn" disabled>Generate Garage Info</button>
        </div>
        
        <div class="button-row">
            <button id="copyBtn" onclick="copyToClipboard()" class="copy-btn" disabled>Copy to Clipboard</button>
            <div class="whatsapp-container">
                <button id="autoWhatsappBtn" onclick="autoSendToWhatsApp()" class="whatsapp-auto-btn" disabled>Send via WhatsApp</button>
                <div id="whatsappValidation" class="whatsapp-validation" style="display: none;">
                    📱 Phone number required for WhatsApp
                </div>
            </div>
        </div>
    </div>
    
    <div id="output"></div>
    </div> <!-- end viewGenerator -->

    <!-- View: apartment list -->
    <div id="viewApartments" class="view" style="display: none;">
        <div class="view-header">
            <button type="button" class="back-btn" data-view="generator">← Back</button>
            <h2>My apartments</h2>
        </div>
        <button type="button" class="primary-action-btn" onclick="openApartmentForm()">+ Add apartment</button>
        <div id="apartmentList" class="apartment-list"></div>
    </div>

    <!-- View: add / edit apartment -->
    <div id="viewApartmentForm" class="view" style="display: none;">
        <div class="view-header">
            <button type="button" class="back-btn" data-view="apartments">← Back</button>
            <h2 id="apartmentFormTitle">Add apartment</h2>
        </div>
        <form id="apartmentForm" class="form-group stacked-form" novalidate>
            <label for="aptName" class="required-label">Name (shown in the list)</label>
            <input type="text" id="aptName" placeholder="e.g. Sunny 101" maxlength="60">

            <label for="aptBuilding">Building</label>
            <input type="text" id="aptBuilding" placeholder="e.g. Sunny Residence">

            <label for="aptAddress">Address</label>
            <input type="text" id="aptAddress" placeholder="Street and number">

            <div class="field-row">
                <div>
                    <label for="aptNumber">Apartment number</label>
                    <input type="text" id="aptNumber">
                </div>
                <div>
                    <label for="aptEntrance">Entrance</label>
                    <input type="text" id="aptEntrance">
                </div>
            </div>

            <div class="field-row">
                <div>
                    <label for="aptFloor">Floor</label>
                    <input type="text" id="aptFloor">
                </div>
                <div>
                    <label for="aptParking">Parking spot</label>
                    <input type="text" id="aptParking">
                </div>
            </div>

            <label for="aptGarageLevel">Garage level</label>
            <input type="text" id="aptGarageLevel" placeholder="e.g. -1">

            <div id="apartmentFormError" class="error-message" style="display: none;"></div>

            <button type="submit" id="saveApartmentBtn" class="save-btn">Save apartment</button>
            <button type="button" id="deleteApartmentBtn" class="danger-btn" style="display: none;">Delete apartment</button>
        </form>
    </div>

    <!-- View: edit messages -->
    <div id="viewMessages" class="view" style="display: none;">
        <div class="view-header">
            <button type="button" class="back-btn" data-view="generator">← Back</button>
            <h2>Edit messages</h2>
        </div>

        <div class="form-group">
            <label for="msgApartment">Apartment</label>
            <select id="msgApartment"></select>
        </div>

        <div class="form-group">
            <label class="form-label">Language</label>
            <div class="radio-group">
                <label class="radio-container">
                    <input type="radio" name="msgLanguage" value="sr" checked>
                    <span class="radio-checkmark"></span>
                    Serbian
                </label>
                <label class="radio-container">
                    <input type="radio" name="msgLanguage" value="en">
                    <span class="radio-checkmark"></span>
                    English
                </label>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Message type</label>
            <div class="radio-group radio-group-vertical">
                <label class="radio-container">
                    <input type="radio" name="msgType" value="reservation" checked>
                    <span class="radio-checkmark"></span>
                    Reservation (with transport)
                </label>
                <label class="radio-container">
                    <input type="radio" name="msgType" value="reservation_no_transport">
                    <span class="radio-checkmark"></span>
                    Reservation (without transport)
                </label>
                <label class="radio-container">
                    <input type="radio" name="msgType" value="garage">
                    <span class="radio-checkmark"></span>
                    Garage info
                </label>
            </div>
        </div>

        <div class="form-group">
            <div class="editor-field-header">
                <label for="msgTemplate">Message <span id="msgTemplateBadge" class="template-badge"></span></label>
                <button type="button" id="msgResetBtn" class="editor-reset-btn">Reset to default</button>
            </div>
            <textarea id="msgTemplate" class="template-textarea" rows="16"></textarea>

            <div class="editor-hint">Tap a placeholder to insert it at the cursor:</div>
            <div id="placeholderChips" class="placeholder-chips"></div>
        </div>

        <div id="msgStatus" class="editor-status" style="display: none;"></div>

        <button type="button" id="saveMessagesBtn" class="save-btn">Save messages</button>
    </div>

    <!-- View: my profile -->
    <div id="viewProfile" class="view" style="display: none;">
        <div class="view-header">
            <button type="button" class="back-btn" data-view="generator">← Back</button>
            <h2>My profile</h2>
        </div>
        <form id="profileForm" class="form-group stacked-form" novalidate>
            <label>Email</label>
            <div id="profileEmail" class="readonly-value"></div>

            <label for="profileName" class="required-label">Name</label>
            <input type="text" id="profileName" maxlength="40" autocomplete="given-name">

            <div id="profileStatus" class="editor-status" style="display: none;"></div>

            <button type="submit" id="saveProfileBtn" class="save-btn">Save profile</button>
        </form>
    </div>

    </div> <!-- end app container -->

    <!-- Side menu -->
    <div id="menuBackdrop" class="menu-backdrop" hidden></div>
    <nav id="sideMenu" class="side-menu" aria-label="Main menu" aria-hidden="true">
        <div class="side-menu-header">
            <div>
                <div class="side-menu-title">Menu</div>
                <div id="menuUserEmail" class="side-menu-email"></div>
            </div>
            <button type="button" id="menuCloseBtn" class="menu-close-btn" aria-label="Close menu">✕</button>
        </div>

        <button type="button" class="menu-item" data-view="generator">💬 Message generator</button>

        <div class="menu-section">Apartments</div>
        <button type="button" class="menu-item" data-action="addApartment">➕ Add apartment</button>
        <button type="button" class="menu-item" data-view="apartments">🏠 Manage apartments</button>

        <div class="menu-section">Messages</div>
        <button type="button" class="menu-item" data-view="messages">✏️ Edit messages</button>

        <div class="menu-section">Account</div>
        <button type="button" class="menu-item" data-view="profile">👤 My profile</button>

        <button type="button" class="menu-item menu-logout" data-action="logout">🚪 Log out</button>
    </nav>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="templates.js"></script>
    <script src="auth.js"></script>
    <script src="api.js"></script>
    <script src="pwa.js"></script>
    <script src="menu.js"></script>
    <script src="apartments.js"></script>
    <script src="editor.js"></script>
    <script src="profile.js"></script>
    <script src="app.js"></script>
</body>
</html>
