# Writes a timestamp to the Supabase database every day so the free project is not paused for inactivity
# (a plain read was not enough). Needs the keepalive_ping() function from supabase/schema.sql.
# Requires repository secrets SUPABASE_URL and SUPABASE_ANON_KEY
# (GitHub -> Settings -> Secrets and variables -> Actions).
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL / SUPABASE_ANON_KEY are not set"
            exit 1
          fi
          curl --fail --silent --show-error -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$SUPABASE_URL/rest/v1/rpc/keepalive_ping"
          echo
          echo "Supabase ping OK"
